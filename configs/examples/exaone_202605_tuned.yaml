experiment_name: exaone_202605_tuned
# EXAONE judge tuning: guideline_with_examples prompt + max_tokens 16384.
# minimal/8192로는 reasoning이 budget을 잠식해 12개 빈 응답 발생, FN/FP 다수 관찰됨.
# 이전 baseline: outputs/20260522_exaone_202605 (Scott's pi 0.614).
datasets:
  - name: evouna_tq
    path: data/EVOUNA/TQ.json
    sampling:
      sample_size: 600
      seed: 42
  - name: evouna_nq
    path: data/EVOUNA/NQ.json
    sampling:
      sample_size: 600
      seed: 42

filter:
  improper: false
  exclude_non_boolean_labels: true
  exclude_empty_candidate_answers: true

judge_models:
  # LG AI Research 공식 권장값(model card "Usage Guideline"):
  # temperature=1.0, top_p=0.95, presence_penalty=0.0, max_new_tokens=16384 (reasoning mode).
  - name: k_exaone_236b_a23b_tuned
    provider: openai_compatible
    model: LGAI-EXAONE/K-EXAONE-236B-A23B
    endpoint: https://api.friendli.ai/serverless/v1/chat/completions
    api_key_env: FRIENDLI_API_KEY
    temperature: 1.0
    top_p: 0.95
    presence_penalty: 0.0
    max_tokens: 16384
    system_prompt: "You are K-EXAONE, a large language model developed by LG AI Research in South Korea, built to serve as a helpful and reliable assistant."

evaluation:
  prompt_templates:
    - guideline_with_examples
  retry_count: 0
  invalid_output_policy: store_invalid
  bootstrap_iterations: 200
  enable_prompt_sensitivity: false
  enable_reference_order_sensitivity: false
  enable_dummy_answer_test: false

output:
  experiment_name: exaone_202605_tuned
  save_raw_predictions: true
  save_report: true

telemetry:
  enabled: false
