experiment_name: solar_202605_tuned
# Solar Pro3 tuning: guideline_with_examples prompt + max_tokens 16384.
# Upstage 공식 권장값(https://console.upstage.ai/docs/models/solar-pro-3):
# temperature=0.7 (reasoning), top_p=0.95, frequency_penalty=1.1, presence_penalty=0.0
# reasoning_effort: high (정확도 우선; minimal/low/medium/high 중 선택 가능)
# 이전 baseline: outputs/20260509_frontier_latest_202605 (solar_pro_3, minimal prompt).
datasets:
  - name: evouna_tq
    path: data/EVOUNA/TQ.json
    sampling:
      sample_size: 600
      seed: 42
  - name: evouna_nq
    path: data/EVOUNA/NQ.json
    sampling:
      sample_size: 600
      seed: 42

filter:
  improper: false
  exclude_non_boolean_labels: true
  exclude_empty_candidate_answers: true

judge_models:
  # Upstage 공식 권장값(model card "Usage Guideline"):
  # temperature=0.7 (complex reasoning), top_p=0.95, frequency_penalty=1.1
  - name: solar_pro_3_tuned
    provider: openai_compatible
    model: solar-pro3
    endpoint: https://api.upstage.ai/v1/chat/completions
    api_key_env: UPSTAGE_API_KEY
    temperature: 0.7
    top_p: 0.95
    frequency_penalty: 1.1
    presence_penalty: 0.0
    reasoning_effort: high
    max_tokens: 16384

evaluation:
  prompt_templates:
    - guideline_with_examples
  retry_count: 0
  invalid_output_policy: store_invalid
  bootstrap_iterations: 200
  enable_prompt_sensitivity: false
  enable_reference_order_sensitivity: false
  enable_dummy_answer_test: false
  workers: 5

output:
  experiment_name: solar_202605_tuned
  save_raw_predictions: true
  save_report: true

telemetry:
  enabled: false
