experiment_name: frontier_latest_202605
# Cost estimate basis: 196,564 input tokens and 41,867 output tokens per model,
# copied from the last completed 1,200-row run.
# Estimated total for all 17 configured models: $8.876374 per run.
datasets:
  - name: evouna_tq
    path: data/EVOUNA/TQ.json
    sampling:
      sample_size: 600
      seed: 42
  - name: evouna_nq
    path: data/EVOUNA/NQ.json
    sampling:
      sample_size: 600
      seed: 42

filter:
  improper: false
  exclude_non_boolean_labels: true
  exclude_empty_candidate_answers: true

judge_models:
  # Default route: OpenRouter. Set OPENROUTER_API_KEY.
  # Price: $5/M input, $30/M output; estimated run cost: $2.238830.
  - name: gpt_5_5
    provider: openai_compatible
    model: openai/gpt-5.5
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 512

  # Price: $5/M input, $25/M output; estimated run cost: $2.029495.
  - name: claude_opus_4_7
    provider: openai_compatible
    model: anthropic/claude-opus-4.7
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 512

  # Price: $3/M input, $15/M output; estimated run cost: $1.217697.
