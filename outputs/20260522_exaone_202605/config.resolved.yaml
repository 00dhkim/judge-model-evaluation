experiment_name: exaone_202605
datasets:
- name: evouna_tq
  path: data/EVOUNA/TQ.json
  sampling:
    sample_size: 600
    seed: 42
- name: evouna_nq
  path: data/EVOUNA/NQ.json
  sampling:
    sample_size: 600
    seed: 42
filter:
  improper: false
  exclude_non_boolean_labels: true
  exclude_empty_candidate_answers: true
judge_models:
- name: k_exaone_236b_a23b
  provider: openai_compatible
  model: LGAI-EXAONE/K-EXAONE-236B-A23B
  endpoint: https://api.friendli.ai/serverless/v1/chat/completions
  api_key_env: FRIENDLI_API_KEY
  max_tokens: 8192
evaluation:
  prompt_templates:
  - minimal
  retry_count: 0
  invalid_output_policy: store_invalid
  bootstrap_iterations: 200
  enable_prompt_sensitivity: false
  enable_reference_order_sensitivity: false
  enable_dummy_answer_test: false
output:
  experiment_name: exaone_202605
  save_raw_predictions: true
  save_report: true
telemetry:
  enabled: false
