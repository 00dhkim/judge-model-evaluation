  model: deepseek/deepseek-v4-pro
  endpoint: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
  max_tokens: 512
- name: deepseek_v4_flash
  provider: openai_compatible
  model: deepseek/deepseek-v4-flash
  endpoint: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
